name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t edu-tutor-api .
      - name: Run container
        run: docker run -d --name api -p 8000:8000 edu-tutor-api
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/docs > /dev/null && exit 0
            sleep 2
          done
          docker logs api
          exit 1